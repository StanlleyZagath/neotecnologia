<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neotecnologia</title>
<script>try{var t=localStorage.getItem("neo.theme");document.documentElement.dataset.theme=t||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside id="side">
  <h1><img class="brand" src="assets/logo-neo.jpg" alt="Neo Tecnologia"><span>Neotecnologia<small class="bt">Engenharia clínica</small></span></h1>
  <nav id="nav" aria-label="Seções"></nav>
  <div class="tools">
    <div class="ng">Ferramentas</div>
    <button onclick="editEmpresa()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l7-4v17M10 21h11V11l-6-3M7 10v.01M7 14v.01M14 14v.01M14 18v.01"/></svg>Dados da empresa</button>
    <button id="exportBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Exportar dados</button>
    <button id="importBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>Importar dados</button>
    <button id="demoBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.3L20 9l-4.2 3.9L17 19l-5-2.9L7 19l1.2-6.1L4 9l5.8-.7z"/></svg>Dados de exemplo</button>
    <button id="themeBtn" class="ghost" aria-label="Alternar modo claro e escuro"></button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</aside>
<div id="content">
  <div id="alerts"></div>
  <main id="view"></main>
</div>
</div>
<!-- Menu do celular: barra inferior (4 atalhos + "Mais"). Fica oculto no computador. -->
<div id="moreBg" hidden></div>
<section id="more" hidden aria-label="Mais opções">
  <h2>Mais seções</h2>
  <div class="mgrid"></div>
  <h3>Ferramentas</h3>
  <div class="mtools">
    <button class="ghost" onclick="closeMore();editEmpresa()">Dados da empresa</button>
    <button class="ghost" data-proxy="exportBtn">Exportar dados</button>
    <button class="ghost" data-proxy="importBtn">Importar dados</button>
    <button class="ghost" data-proxy="demoBtn">Dados de exemplo</button>
  </div>
</section>
<nav id="bnav" aria-label="Menu principal"></nav>
<div id="laudo"></div>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<script src="vendor/pdf.min.js"></script>
<script src="printcss.js"></script>
<script src="forms.js"></script>
<script src="docs.js"></script>
<script src="pedido.js"></script>
<script src="assets-data.js"></script>
<script src="lote.js"></script>
<script src="app.js"></script>
</body>
</html>
